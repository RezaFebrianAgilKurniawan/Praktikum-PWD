<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
  "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">

<head>
    <link rel="stylesheet" type="text/css" href="css/style.css" />
  <title>Reservation Hotel Room</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>

<body>
    <h1>Reservation Hotel Room</h1>

    <form action="" method="post">
        <fieldset>
            <legend>Personal Date</legend>
            <label for="name">Name</label><br />
            <input type="text" id="name" name="name" /><br />
            <label for="gender">Gender</label><br />
            <input type="text" id="gender" name="gender" /><br />
            <label for="email">Email Address</label><br />
            <input type="text" id="email" name="email" /><br />
            <label for="'notlp">Telp Nummber</label><br />
            <input type="text" id="notelp" name="notelp" /><br />
        </fieldset>

  
  <div class="section-title">Reservation Room form</div>
  <ol>
    <li>
        <label for="reservation">Reservation Name</label><br />
        <input type="text" id="reservation" name="reservation" /><br />
    </li>
    <li>
        <label for="booking_date">Booking Date</label><br />
        <input type="text" id="booking_date" name="booking_date" /><br />
    </li>
    <li>
      Room Type<br />
      <select id="room_type" name="room_type">
        <option selected="selected">Deluxe</option>
        <option>Superior</option>
        <option>Standard</option>
      </select>
    </li>
    <li>
      Bed Type<br />
      <select id="bed_type" name="bed_type">
        <option selected="selected">Single bed</option>
        <option>Double bed</option>
        <option>Twin bed</option>
      </select>
    </li>
    <li>
      Breakfast<br />
      <label><input type="radio" name="breakfast" value="with" /> With Breakfast</label>
      <label><input type="radio" name="breakfast" value="without" /> Without Breakfast</label>
    </li>
  </ol>

  <fieldset>
    <legend>Payment</legend>
    <ol>
      <li>
        <label for="checkin">Check In Date</label><br />
        <input type="text" id="checkin" name="checkin" /><br />
      </li>
      <li>
        <label for="checkout">Check Out Date</label><br />
        <input type="text" id="checkout" name="checkout" /><br />
      </li>
      <li>
        Payment Method<br />
        <select id="paymethod" name="paymethod">
          <option selected="selected">cash</option>
          <option>debit</option>
          <option>credit</option>
        </select>
      </li>
    </ol>
  </fieldset>

  <input type="submit" value="submit" class="submit" /></form>

    </body>
</html>
